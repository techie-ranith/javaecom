spring.config.import=optional:file:.env[.properties]
spring.application.name=my-app
spring.application.name=perfume-store
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/perfume_store;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.seed.enabled=${SEED_ENABLED:true}
